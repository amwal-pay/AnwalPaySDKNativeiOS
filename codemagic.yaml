workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Amwal CodeMagic
    environment:
      # Automatic signing: Codemagic fetches/creates the cert and profile from
      # App Store Connect on every build, so they can never go stale. Do NOT go
      # back to naming manually uploaded files here — those expire and break CI.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anwalpay.sdk.example
      vars:
        XCODE_WORKSPACE: "AnwalPaySDKNativeiOSExample.xcworkspace"
        XCODE_SCHEME: "AnwalPaySDKNativeiOSExample"
        APP_STORE_APPLE_ID: 6744919252
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          pod install --repo-update
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          # Codemagic's PROJECT_BUILD_NUMBER is a per-app counter that lags the
          # builds already in TestFlight (it gave 32 when TestFlight had 97), so
          # base the number on the latest TestFlight build instead.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          if [ "$PROJECT_BUILD_NUMBER" -gt "$NEW_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER=$PROJECT_BUILD_NUMBER
          fi
          echo "Latest TestFlight build: $LATEST_BUILD_NUMBER -> using $NEW_BUILD_NUMBER"
          agvtool new-version -all "$NEW_BUILD_NUMBER"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Debug code signing setup
        script: |
          echo "Available provisioning profiles:"
          security find-identity -v -p codesigning
          echo "Available certificates:"
          security find-certificate -a
      - name: Build IPA for App Store distribution
        script: |
          xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME" \
          --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - amr.saied@amwal-pay.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Testers
        submit_to_app_store: false
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true